name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
          rustup override set stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Static checks
        run: bash scripts/check.sh

  test:
    name: workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run workspace tests
        run: cargo test --workspace

  circuits:
    name: noir circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Install Noir
        run: |
          curl -sL https://raw.githubusercontent.com/noir-lang/noirup/main/install \
            | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup
          nargo --version

      - name: Install Barretenberg (bb)
        run: |
          curl -sL https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install \
            | bash
          export PATH="$HOME/.bb:$PATH"
          # Keep in sync with TESTED_BB_VERSION in crates/ultrahonk/src/lib.rs.
          bbup -v 6.0.0-nightly.20260903 --no-modify-path
          bb --version

      - name: Cache Noir build output
        uses: actions/cache@v4
        with:
          path: circuits/target
          key: ${{ runner.os }}-nargo-${{ hashFiles('circuits/**/Nargo.toml', 'circuits/**/src/**') }}
          restore-keys: ${{ runner.os }}-nargo-

      - name: Circuit unit tests
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          cd circuits && nargo test

      - name: Circuit test vectors
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          bash scripts/generate-test-vectors.sh

      - name: Cross-language vector runner (mock + circuit tiers)
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.nargo/bin:$PATH"
          cargo test -p crucible-tests --test vectors

      - name: UltraHonk live proving (bb round trips)
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.nargo/bin:$HOME/.bb:$PATH"
          cargo test -p crucible-tests --test ultrahonk
