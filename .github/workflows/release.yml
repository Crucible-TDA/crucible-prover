name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-build:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
          rustup override set stable

      - name: Static checks and workspace tests
        run: |
          bash scripts/check.sh
          cargo test --workspace

      - name: Release build (no debug symbols)
        run: cargo build --release

      # The CLI binary arrives in a later batch; once it exists, this job
      # uploads it to the release. The build step above keeps the tag
      # gate honest until then.
      - name: Assert release build produced artifacts
        run: ls target/release/*.rlib | head -1
